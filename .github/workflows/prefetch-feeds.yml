name: Pre-fetch feeds

# Fetches the RSS feeds server-side (open egress on the runner, no CORS proxy) and
# commits feeds-cache.json. The commit is marked [skip ci] so a data refresh never
# triggers a Docker rebuild of the Space.

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours, offset off the hour
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prefetch-feeds
  cancel-in-progress: false

jobs:
  prefetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install feedparser

      - name: Fetch feeds into feeds-cache.json
        run: python scripts/prefetch_feeds.py

      - name: Commit the cache if it changed
        run: |
          if git diff --quiet -- feeds-cache.json; then
            echo "No feed changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feeds-cache.json
          git commit -m "chore(data): refresh feeds-cache.json [skip ci]"
          git push
