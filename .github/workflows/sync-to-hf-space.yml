name: Sync to Hugging Face Space

# Mirrors this repository's main branch to the Hugging Face Space
# https://huggingface.co/spaces/mgifford/audio-news (Static SDK).
#
# One-time setup: add a repository secret named HF_TOKEN
# (Settings -> Secrets and variables -> Actions -> New repository secret).
# Create the token at https://huggingface.co/settings/tokens with write access
# to the Space. The Space's SDK must be set to "Static".

on:
  push:
    branches: [main]
  workflow_dispatch:

# Avoid overlapping pushes to the Space.
concurrency:
  group: hf-space-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to the Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: mgifford/audio-news
        run: |
          if [ -z "${HF_TOKEN}" ]; then
            echo "::error::HF_TOKEN secret is not set. Add it under Settings -> Secrets and variables -> Actions, then re-run." >&2
            exit 1
          fi
          # The token authenticates the push; the username field is ignored by HF.
          git push --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}.git" HEAD:main
