name: Sync to Hugging Face Space

# Mirrors this repository's main branch to the Hugging Face Docker Space
# https://huggingface.co/spaces/mgifford/audio-news, but only after fast CI passes,
# then waits for the Space to report healthy.
#
# One-time setup: add a repository secret named HF_TOKEN
# (Settings -> Secrets and variables -> Actions -> New repository secret).
# Create the token at https://huggingface.co/settings/tokens with write access
# to the Space. The Space's SDK must be set to "Docker".

on:
  push:
    branches: [main]
    # Docs-only changes don't need a ~10-minute Docker rebuild. README is NOT listed
    # here on purpose (its front matter is the Space config), and neither are
    # sources.json / feeds-cache.json (the frontend reads them). paths-ignore can't
    # negate, so the doc paths are listed explicitly rather than with a broad **/*.md.
    paths-ignore:
      - "PHASE*.md"
      - "decisions/**"
  workflow_dispatch:

concurrency:
  group: hf-space-sync
  cancel-in-progress: true

jobs:
  # Cheap gate: fail here in seconds rather than 10 minutes into a Docker build.
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Static checks
        run: |
          python -m py_compile app.py scripts/prefetch_feeds.py
          node --check app.js
          python -c "import json; json.load(open('sources.json'))"
      - name: Backend tests (no model needed; llama-cpp is imported lazily)
        run: |
          pip install "fastapi>=0.110" "pydantic>=2.6" httpx pytest feedparser
          python -m pytest -q   # `python -m` puts the repo root on sys.path so `import app` resolves

  sync:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to the Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: mgifford/audio-news
        run: |
          if [ -z "${HF_TOKEN}" ]; then
            echo "::error::HF_TOKEN secret is not set. Add it under Settings -> Secrets and variables -> Actions, then re-run." >&2
            exit 1
          fi
          # Stamp the deployed commit so /api/health can prove which build is live.
          # This commit is pushed only to the Space (never back to origin), and is
          # recreated on each deploy, so it does not accumulate on GitHub.
          echo "${GITHUB_SHA}" > BUILD_SHA
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add BUILD_SHA
          git commit -m "deploy: stamp ${GITHUB_SHA}" --no-verify
          # The token authenticates the push; the username field is ignored by HF.
          git push --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}.git" HEAD:main

      - name: Wait for the Space to report this build healthy
        env:
          HEALTH_URL: https://mgifford-audio-news.hf.space/api/health
        run: |
          echo "Polling ${HEALTH_URL} for build ${GITHUB_SHA} (rebuild + cold start can take minutes)…"
          for i in $(seq 1 60); do   # up to ~20 min at 20s intervals
            body=$(curl -s --max-time 15 "${HEALTH_URL}" || true)
            if echo "${body}" | grep -q "\"build\":\"${GITHUB_SHA}\""; then
              echo "Space healthy and serving build ${GITHUB_SHA} after ~$((i*20))s."
              exit 0
            fi
            echo "  attempt ${i}: not yet (a stale container or still building); waiting…"
            sleep 20
          done
          echo "::error::Space did not report this build healthy in time. Check the Space build logs." >&2
          exit 1

      - name: Feed smoke (informational; does not fail the deploy)
        continue-on-error: true
        env:
          FEEDS_URL: https://mgifford-audio-news.hf.space/api/feeds
        run: |
          # Feeds can be individually flaky, so this reports counts rather than gating.
          body=$(curl -s --max-time 60 "${FEEDS_URL}" || true)
          total=$(echo "${body}" | grep -o "\"itemCount\":[0-9]*" | grep -o "[0-9]*" | paste -sd+ - | bc 2>/dev/null || echo "?")
          echo "Server-side /api/feeds total items: ${total}"
          if [ "${total}" = "0" ]; then
            echo "::warning::/api/feeds returned 0 items — every feed may be unreachable server-side. Investigate."
          fi
